project:
  name: smoking-recognition
  output_dir: data/outputs

video:
  source: data/videos/test.mp4
  img_size: 960
  sample_fps: 10
  display: true
  save_video: true

models:
  person_detector: yolo11n.pt
  pose_model: yolo11n-pose.pt
  cigarette_detector: data/models/cigarette.pt

device:
  type: cpu
  half: false

detection:
  person_conf: 0.45
  cigarette_conf: 0.35
  iou: 0.5
  classes:
    person: 0

detail:
  enabled: true
  trigger_on_focus: true
  roi_mode: face
  save_focus_crops: true
  crop_scale: 1.10
  face_crop_scale: 1.22
  depth_crop_scale: 1.35
  max_saved_crops: 300
  model_img_size: 640

depth:
  enabled: true
  backend: transformers
  model: depth-anything/Depth-Anything-V2-Small-hf
  run_on_detail_trigger: true
  hand_mouth_depth_delta_threshold: 0.18
  sample_radius_ratio: 0.025
  min_depth_contrast: 0.03
  require_depth_consistency_for_detail: true
  save_depth_debug: true

pose:
  keypoint_conf: 0.35
  focus_keypoint_conf: 0.05
  hand_to_mouth_distance_ratio: 0.18
  hand_to_face_distance_ratio: 0.75
  fingertip_to_mouth_distance_ratio: 0.55
  fingertip_extension_ratio: 0.38
  face_box_scale: 2.85
  face_box_width_scale: 1.25
  face_box_height_scale: 1.55
  face_box_y_offset_ratio: 0.18
  min_valid_keypoints: 8

temporal:
  window_seconds: 8
  min_hand_to_mouth_hits: 12
  min_focus_hand_to_face_hits: 5
  min_cigarette_hits: 2
  min_detail_trigger_hits: 10
  min_object_detail_ratio: 0.35
  min_event_duration_seconds: 3
  cooldown_seconds: 20

rules:
  enable_time_rule: true
  allowed_smoking_periods:
    - "12:00-12:30"
    - "18:00-18:30"
  alarm_only_outside_allowed_period: true

roi:
  enabled: false
  polygon:
    - [0, 0]
    - [1920, 0]
    - [1920, 1080]
    - [0, 1080]

alarm:
  smoking_score_threshold: 0.78
  detail_model_score_threshold: 0.55
  pose_only_score_threshold: 0.55
  save_snapshot: true
  save_clip: true
  clip_pre_seconds: 5
  clip_post_seconds: 5
